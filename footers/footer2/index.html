<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Awarded White Footer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0a0a;
  --footer:#ffffff;
  --text:#0a0a0a;
  --muted:rgba(0,0,0,.6);
  --border:rgba(0,0,0,.08);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,system-ui,sans-serif;
}

body{
  background:var(--bg);
  height:220vh;
}

/* dummy content */
.spacer{
  height:120vh;
}

/* FOOTER */
footer{
  background:var(--footer);
  height:100vh;
  overflow:hidden;
}

.footer-inner{
  height:100%;
  padding:80px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* TEXT */
.footer-title{
  font-size:clamp(3rem,8vw,8rem);
  font-weight:800;
  line-height:1;
  color:var(--text);
}

.line{
  overflow:hidden;
}

.word,.char{
  display:inline-block;
}

/* LINKS */
.footer-links{
  display:flex;
  flex-wrap:wrap;
  gap:60px;
}

.footer-link{
  position:relative;
  font-size:20px;
  color:var(--muted);
  cursor:pointer;
  text-decoration:none;
}

.footer-link span{
  display:inline-block;
}

.footer-link::after{
  content:'';
  position:absolute;
  left:0;
  bottom:-6px;
  width:0%;
  height:1px;
  background:var(--text);
  transition:width .5s cubic-bezier(.16,1,.3,1);
}

.footer-link:hover{
  color:var(--text);
}
.footer-link:hover::after{
  width:100%;
}

/* BOTTOM */
.footer-bottom{
  display:flex;
  justify-content:space-between;
  padding-top:30px;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:14px;
}

/* RESPONSIVE */
@media(max-width:768px){
  .footer-inner{ padding:40px 20px; }
  .footer-links{ gap:30px; }
  .footer-bottom{
    flex-direction:column;
    gap:10px;
    text-align:center;
  }
}
</style>
</head>

<body>

<div class="spacer"></div>

<footer>
  <div class="footer-inner">

    <h2 class="footer-title">
      <div class="line">Let’s build something</div>
      <div class="line">unforgettable together.</div>
    </h2>

    <div class="footer-links">
      <a class="footer-link"><span>Instagram</span></a>
      <a class="footer-link"><span>LinkedIn</span></a>
      <a class="footer-link"><span>GitHub</span></a>
      <a class="footer-link"><span>Dribbble</span></a>
      <a class="footer-link"><span>Contact</span></a>
    </div>

    <div class="footer-bottom">
      <span>© 2026 Your Studio</span>
      <span>Award-Winning Digital Experience</span>
    </div>

  </div>
</footer>

<script>
gsap.registerPlugin(ScrollTrigger);

/* SPLIT TEXT */
document.querySelectorAll('.line').forEach(line=>{
  const text = line.textContent;
  line.innerHTML = text.split(' ').map(word=>{
    return `<span class="word">${[...word].map(c=>`<span class="char">${c}</span>`).join('')}</span>&nbsp;`;
  }).join('');
});

/* MASTER TIMELINE */
const footerTL = gsap.timeline({ paused:true });

footerTL.from('.char',{
  y:'120%',
  opacity:0,
  stagger:0.02,
  duration:1,
  ease:'power4.out'
});

footerTL.from('.footer-link',{
  y:30,
  opacity:0,
  stagger:0.15,
  duration:0.7,
  ease:'power3.out'
}, '-=0.5');

/* SCROLL CONTROL (PERFECT LOOP) */
ScrollTrigger.create({
  trigger:'footer',
  start:'top 80%',
  end:'bottom 20%',
  onEnter: () => footerTL.play(0),
  onLeave: () => footerTL.progress(0).pause(),
  onEnterBack: () => footerTL.play(0),
  onLeaveBack: () => footerTL.progress(0).pause()
});

/* MAGNETIC (DESKTOP ONLY) */
if(!('ontouchstart' in window)){
  document.querySelectorAll('.footer-link').forEach(link=>{
    const span = link.querySelector('span');

    link.addEventListener('mousemove',e=>{
      const r = link.getBoundingClientRect();
      gsap.to(span,{
        x:(e.clientX-r.left-r.width/2)*0.35,
        y:(e.clientY-r.top-r.height/2)*0.35,
        duration:.3,
        ease:'power3.out'
      });
    });

    link.addEventListener('mouseleave',()=>{
      gsap.to(span,{
        x:0,y:0,
        duration:.6,
        ease:'elastic.out(1,0.4)'
      });
    });
  });
}
</script>

</body>
</html>
