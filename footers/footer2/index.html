<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Premium Magnetic Footer – Black Theme</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<!-- Remix Icon -->
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<!-- Lenis -->
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>



</head>

<body>

<div class="spacer">Scroll ↓</div>

<footer class="footer">

  <div class="cursor-glow"></div>

  <div class="footer-inner">

    <div class="footer-col magnetic-box">
      <h2 class="magnetic">XBzin</h2>
      <p class="magnetic">
        AI-driven platforms crafted with clarity, performance, and modern motion.
      </p>
    </div>

    <div class="footer-col magnetic-box">
      <h4 class="magnetic">Company</h4>
      <ul>
        <li><a class="magnetic" href="#">About</a></li>
        <li><a class="magnetic" href="#">Careers</a></li>
        <li><a class="magnetic" href="#">Blog</a></li>
      </ul>
    </div>

    <div class="footer-col magnetic-box">
      <h4 class="magnetic">Resources</h4>
      <ul>
        <li><a class="magnetic" href="#">Docs</a></li>
        <li><a class="magnetic" href="#">Support</a></li>
        <li><a class="magnetic" href="#">API</a></li>
      </ul>
    </div>

    <div class="footer-col newsletter magnetic-box">
      <h4 class="magnetic">Stay Updated</h4>
      <input type="email" placeholder="Email address">
      <button class="magnetic">Subscribe</button>
    </div>

  </div>

  <div class="footer-bottom ">
    <span>© 2026 XBzin</span>
    <div class="socials">
      <a class="magnetic" href="#"><i class="ri-instagram-line"></i></a>
      <a class="magnetic" href="#"><i class="ri-twitter-x-line"></i></a>
      <a class="magnetic" href="#"><i class="ri-linkedin-line"></i></a>
      <a class="magnetic" href="#"><i class="ri-github-line"></i></a>
    </div>
  </div>

</footer>

<script src="script.js"></script>


</body>
</html>
