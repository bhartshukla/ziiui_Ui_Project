<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebGL Image Transition</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- THREE -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Lenis -->
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Bebas Neue', sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: #0e0e0e;
    }

    header, footer {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    header h1,
    footer h2 {
      font-size: 7vmax;
      color: #fff;
      text-align: center;
    }

    #gl-container {
      position: relative;
      width: 100%;
    }

    #gl-scroller {
      height: 100vh;
      position: sticky;
      top: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    .section {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .section p {
      font-size: 10vmax;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <h1>Immersive WebGL<br>Transitions</h1>
</header>

<div id="gl-container">
  <div id="gl-scroller"></div>
</div>

<footer>
  <h2>The End</h2>
</footer>

<script>
gsap.registerPlugin(ScrollTrigger);

// Smooth scroll
const lenis = new Lenis();
function raf(time) {
  lenis.raf(time);
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);

// Data
const sections = [
  { text: "LEXA", image: "https://picsum.photos/1200/800?random=1" },
  { text: "ROAR", image: "https://picsum.photos/1200/800?random=2" },
  { text: "SPARK", image: "https://picsum.photos/1200/800?random=3" }
];

const container = document.getElementById("gl-scroller");
const wrapper = document.getElementById("gl-container");

// Overlay text
const overlay = document.createElement("div");
overlay.classList.add("overlay");

sections.forEach(s => {
  const div = document.createElement("div");
  div.classList.add("section");
  div.innerHTML = `<p>${s.text}</p>`;
  overlay.appendChild(div);
});

wrapper.appendChild(overlay);
wrapper.style.height = sections.length * 100 + "vh";

// THREE setup
let scene = new THREE.Scene();
let camera, renderer, mesh;

const width = window.innerWidth;
const height = window.innerHeight;

camera = new THREE.OrthographicCamera(
  width / -2, width / 2,
  height / 2, height / -2,
  1, 1000
);

camera.position.z = 1;

renderer = new THREE.WebGLRenderer({ alpha: true });
renderer.setSize(width, height);
container.appendChild(renderer.domElement);

// Load textures
const loader = new THREE.TextureLoader();

let textures = sections.map(s => loader.load(s.image));

// Shader
const material = new THREE.ShaderMaterial({
  uniforms: {
    texture1: { value: textures[0] },
    texture2: { value: textures[1] },
    progress: { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D texture1;
    uniform sampler2D texture2;
    uniform float progress;
    varying vec2 vUv;

    void main() {
      vec4 t1 = texture2D(texture1, vUv);
      vec4 t2 = texture2D(texture2, vUv);
      gl_FragColor = mix(t1, t2, progress);
    }
  `
});

const geometry = new THREE.PlaneGeometry(width, height);
mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

// Scroll animation
let current = 0;

ScrollTrigger.create({
  trigger: wrapper,
  start: "top top",
  end: "+=" + (sections.length - 1) * 100 + "%",
  scrub: true,
  onUpdate: (self) => {
    let index = Math.floor(self.progress * (sections.length - 1));

    if (index !== current) {
      material.uniforms.texture1.value = textures[current];
      material.uniforms.texture2.value = textures[index];

      gsap.to(material.uniforms.progress, {
        value: 1,
        duration: 0.8,
        onComplete: () => {
          material.uniforms.texture1.value = textures[index];
          material.uniforms.progress.value = 0;
          current = index;
        }
      });
    }
  }
});

// Render loop
function animate() {
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

// Resize
window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
