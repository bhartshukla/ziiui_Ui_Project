<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clean Shader Scroll</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#0a0a0a;color:white;overflow-x:hidden;}

.section{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:60px;
  position:relative;
  z-index:2;
}

.content{
  max-width:800px;
  text-align:center;
}

h1{
  font-size:4rem;
  margin-bottom:20px;
}

p{
  font-size:1.1rem;
  opacity:0.8;
  line-height:1.6;
}

button{
  margin-top:25px;
  padding:12px 28px;
  border:none;
  background:white;
  color:black;
  cursor:pointer;
  font-weight:600;
}

#gl-container{
  position:fixed;
  inset:0;
  z-index:1;
}
</style>
</head>

<body>

<div class="section">
  <div class="content">
    <h1>Creative Visual Experience</h1>
    <p>Scroll to explore smooth shader-based transitions between sections.</p>
    <button>Explore</button>
  </div>
</div>

<div class="section">
  <div class="content">
    <h1>Clean & Minimal</h1>
    <p>No unnecessary effects. Only meaningful transitions on section change.</p>
    <button>Learn More</button>
  </div>
</div>

<div class="section">
  <div class="content">
    <h1>High Performance</h1>
    <p>Optimized for smooth experience with controlled GPU usage.</p>
    <button>Get Started</button>
  </div>
</div>

<div id="gl-container"></div>

<script>
gsap.registerPlugin(ScrollTrigger);

// ✅ IMAGES
const images = ["image.png","image1.png","image2.png"];

// THREE SETUP
let scene = new THREE.Scene();
let width = window.innerWidth;
let height = window.innerHeight;

let camera = new THREE.OrthographicCamera(
  width/-2,width/2,height/2,height/-2,-1,1
);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(width,height);
document.getElementById("gl-container").appendChild(renderer.domElement);

// TEXTURES
const loader = new THREE.TextureLoader();
let textures = images.map(src=>{
  let t = loader.load(src);
  t.minFilter = THREE.LinearFilter;
  return t;
});

// SHADER
const material = new THREE.ShaderMaterial({
  uniforms:{
    u_texture0:{value:textures[0]},
    u_texture1:{value:textures[1]},
    u_progress:{value:0}
  },

  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,

  fragmentShader:`
    uniform sampler2D u_texture0;
    uniform sampler2D u_texture1;
    uniform float u_progress;
    varying vec2 vUv;

    void main(){

      vec2 uv = vUv;

      // CLEAN DISTORTION
      float wave = sin(uv.y*8.0) * 0.05;

      vec2 uv0 = uv + wave*(1.0-u_progress);
      vec2 uv1 = uv - wave*u_progress;

      // ZOOM EFFECT
      uv0 = mix(uv0, 0.5 + (uv0-0.5)*1.2, u_progress);
      uv1 = mix(uv1, 0.5 + (uv1-0.5)*0.8, u_progress);

      float prog = smoothstep(0.0,1.0,u_progress);

      vec4 tex0 = texture2D(u_texture0, uv0);
      vec4 tex1 = texture2D(u_texture1, uv1);

      gl_FragColor = mix(tex0, tex1, prog);
    }
  `
});

const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width,height), material);
scene.add(mesh);

// SCROLL TRANSITION ONLY
const sections = document.querySelectorAll(".section");
let current = 0;

sections.forEach((sec,i)=>{
  ScrollTrigger.create({
    trigger: sec,
    start:"top center",
    onEnter:()=>change(i),
    onEnterBack:()=>change(i)
  });
});

function change(i){
  if(i===current) return;

  gsap.to(material.uniforms.u_progress,{
    value:1,
    duration:1,
    ease:"power2.inOut",
    onStart:()=>material.uniforms.u_texture1.value=textures[i],
    onComplete:()=>{
      material.uniforms.u_texture0.value=textures[i];
      material.uniforms.u_progress.value=0;
      current=i;
    }
  });
}

// RENDER (no heavy animation now)
function render(){
  renderer.render(scene,camera);
  requestAnimationFrame(render);
}
render();

// RESIZE
window.addEventListener("resize",()=>{
  width=window.innerWidth;
  height=window.innerHeight;

  renderer.setSize(width,height);

  camera.left=width/-2;
  camera.right=width/2;
  camera.top=height/2;
  camera.bottom=height/-2;
  camera.updateProjectionMatrix();

  mesh.geometry.dispose();
  mesh.geometry=new THREE.PlaneGeometry(width,height);
});
</script>

</body>
</html>
