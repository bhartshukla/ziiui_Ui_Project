<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Shader Scroll</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Bebas Neue',sans-serif;}
body{background:#0a0a0a;color:white;overflow-x:hidden;}

.section{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:2;
}

.section h1{
  font-size:8vw;
  text-align:center;
  pointer-events:none;
  mix-blend-mode: difference;
}

#gl-container{
  position:fixed;
  inset:0;
  z-index:1;
}
</style>
</head>

<body>

<div class="section"><h1>FIRST</h1></div>
<div class="section"><h1>SECOND</h1></div>
<div class="section"><h1>THIRD</h1></div>

<div id="gl-container"></div>

<script>
gsap.registerPlugin(ScrollTrigger);

// ================= IMAGES =================
const images = ["image.png","image1.png","image.png"];

// ================= THREE =================
let scene = new THREE.Scene();

let width = window.innerWidth;
let height = window.innerHeight;

let camera = new THREE.OrthographicCamera(
  width/-2, width/2,
  height/2, height/-2,
  -1, 1
);

let renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(width,height);
document.getElementById("gl-container").appendChild(renderer.domElement);

// ================= TEXTURES =================
const loader = new THREE.TextureLoader();
let textures = images.map(src=>{
  let t = loader.load(src);
  t.minFilter = THREE.LinearFilter;
  return t;
});

// ================= SHADER =================
const material = new THREE.ShaderMaterial({
  uniforms:{
    u_texture0:{value:textures[0]},
    u_texture1:{value:textures[1]},
    u_progress:{value:0},
    u_time:{value:0},
    u_mouse:{value:new THREE.Vector2(0.5,0.5)},
    u_hover:{value:0}
  },

  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,

  fragmentShader:`
    uniform sampler2D u_texture0;
    uniform sampler2D u_texture1;
    uniform float u_progress;
    uniform float u_time;
    uniform vec2 u_mouse;
    uniform float u_hover;
    varying vec2 vUv;

    void main(){

      vec2 uv = vUv;

      // 🔥 DISTORTION (stronger)
      float dist = distance(uv, u_mouse);
      float ripple = sin(dist*20.0 - u_time*5.0) * 0.03 * u_hover;

      float wave = sin(uv.y*10.0 + u_time*2.0) * 0.05;

      vec2 uv0 = uv + wave*(1.0-u_progress) + ripple;
      vec2 uv1 = uv - wave*u_progress - ripple;

      // 🔥 ZOOM EFFECT
      uv0 = mix(uv0, 0.5 + (uv0-0.5)*1.2, u_progress);
      uv1 = mix(uv1, 0.5 + (uv1-0.5)*0.8, u_progress);

      float rgb = 0.02 * sin(u_progress*3.14);

      vec4 tex0 = vec4(
        texture2D(u_texture0, uv0+vec2(rgb,0)).r,
        texture2D(u_texture0, uv0).g,
        texture2D(u_texture0, uv0-vec2(rgb,0)).b,
        1.0
      );

      vec4 tex1 = vec4(
        texture2D(u_texture1, uv1-vec2(rgb,0)).r,
        texture2D(u_texture1, uv1).g,
        texture2D(u_texture1, uv1+vec2(rgb,0)).b,
        1.0
      );

      float prog = smoothstep(0.0,1.0,u_progress);

      gl_FragColor = mix(tex0, tex1, prog);
    }
  `
});

// ================= MESH =================
const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width,height), material);
scene.add(mesh);

// ================= SCROLL =================
const sections = document.querySelectorAll(".section");
let currentIndex = 0;

sections.forEach((section,i)=>{
  ScrollTrigger.create({
    trigger: section,
    start:"top center",
    end:"bottom center",
    onEnter:()=>change(i),
    onEnterBack:()=>change(i)
  });
});

function change(index){
  if(index===currentIndex) return;

  gsap.to(material.uniforms.u_progress,{
    value:1,
    duration:1.2,
    ease:"power3.inOut",
    onStart:()=>{
      material.uniforms.u_texture1.value = textures[index];
    },
    onComplete:()=>{
      material.uniforms.u_texture0.value = textures[index];
      material.uniforms.u_progress.value = 0;
      currentIndex=index;
    }
  });
}

// ================= MOUSE =================
window.addEventListener("mousemove",(e)=>{
  material.uniforms.u_mouse.value.x = e.clientX/width;
  material.uniforms.u_mouse.value.y = 1 - e.clientY/height;
});

// hover intensity
window.addEventListener("mouseenter",()=>{
  gsap.to(material.uniforms.u_hover,{value:1,duration:0.5});
});
window.addEventListener("mouseleave",()=>{
  gsap.to(material.uniforms.u_hover,{value:0,duration:0.5});
});

// ================= RENDER =================
function render(t){
  material.uniforms.u_time.value = t*0.001;
  renderer.render(scene,camera);
  requestAnimationFrame(render);
}
render();

// ================= RESIZE =================
window.addEventListener("resize",()=>{
  width=window.innerWidth;
  height=window.innerHeight;

  renderer.setSize(width,height);

  camera.left=width/-2;
  camera.right=width/2;
  camera.top=height/2;
  camera.bottom=height/-2;
  camera.updateProjectionMatrix();

  mesh.geometry.dispose();
  mesh.geometry=new THREE.PlaneGeometry(width,height);
});
</script>

</body>
</html>
