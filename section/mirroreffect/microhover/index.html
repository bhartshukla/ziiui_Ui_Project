<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZIIUI micerhover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "DM Sans", system-ui, sans-serif;
        background: #0a0a0a;
        color: #ece8e1;
        -webkit-font-smoothing: antialiased;
      }

      .about-hero {
        position: relative;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: clamp(3rem, 10vw, 6rem) clamp(1.25rem, 4vw, 2.5rem);
        text-align: center;
        overflow: hidden;
      }

      .about-hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
            ellipse 80% 55% at 50% 40%,
            rgba(255, 255, 255, 0.04),
            transparent 70%
          ),
          radial-gradient(circle at 50% 100%, rgba(120, 100, 80, 0.08), transparent 45%);
        pointer-events: none;
      }

      .about-hero__kicker {
        position: relative;
        z-index: 2;
        font-size: 0.6875rem;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(236, 232, 225, 0.55);
        margin-bottom: clamp(1.75rem, 4vw, 2.75rem);
      }

      .about-hero__copy {
        position: relative;
        margin-inline: auto;
      }

      .about-hero__headline {
        position: relative;
        z-index: 2;
        font-family: "DM Serif Display", Georgia, serif;
        font-weight: 400;
        font-size: clamp(2rem, 5vw, 3.25rem);
        line-height: 1.28;
        letter-spacing: -0.02em;
        color: #f5f2ec;
        pointer-events: none;
      }

      .about-hero__keyword {
        pointer-events: auto;
        cursor: default;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.22em;
        color: #fff;
        position: relative;
        z-index: 10;
        white-space: nowrap;
        transition: color 0.2s ease;
      }

      .about-hero__keyword:hover,
      .about-hero__keyword:focus-visible {
        color: #e8dcc8;
      }

      .about-hero__keyword:focus-visible {
        outline: 1px dotted rgba(255, 255, 255, 0.6);
        outline-offset: 6px;
      }

      .about-hero__photo-layer {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }

      .about-hero__photo {
        position: absolute;
        width: min(24vw, 220px);
        max-height: min(40vh, 300px);
        aspect-ratio: 3 / 4;
        object-fit: cover;
        border: none;
        border-radius: 2px;
        opacity: 1;
        pointer-events: none;
        will-change: transform;
      }

    </style>
  </head>
  <body>
    <section class="about-hero" id="about-hero">
      <div class="about-hero__photo-layer" aria-hidden="true">
        <img class="about-hero__photo" alt="" src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=520&q=80" />
        <img class="about-hero__photo" alt="" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=520&q=80" />
        <img class="about-hero__photo" alt="" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=520&q=80" />
        <img class="about-hero__photo" alt="" src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=520&q=80" />
        <img class="about-hero__photo" alt="" src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=520&q=80" />
        <img class="about-hero__photo" alt="" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=520&q=80" />
        <img class="about-hero__photo" alt="" src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?auto=format&fit=crop&w=520&q=80" />
        <img class="about-hero__photo" alt="" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=520&q=80" />
      </div>
      <p class="about-hero__kicker">Our approach</p>
      <div class="about-hero__copy">
        <p class="about-hero__headline">
          We cut in <span class="about-hero__keyword" tabindex="0">small runs</span>,<br />
          refuse the throw<span class="about-hero__keyword" tabindex="0"> away rhythm</span>,<br />
          and <span class="about-hero__keyword" tabindex="0"> design </span> for years on the body
        </p>
      </div>
    </section>

    <script>
      (() => {
        const heroSection = document.querySelector("#about-hero");
        const photoElements = heroSection.querySelectorAll(".about-hero__photo");
        const keywordTriggers = heroSection.querySelectorAll(".about-hero__keyword");
        const randomBetween = gsap.utils.random;

        let burstTimeline = null;

        const hidePhotosOffscreen = () =>
          gsap.set(photoElements, {
            left: "50%",
            top: "50%",
            xPercent: -50,
            yPercent: -50,
            x: 0,
            y: 0,
            rotation: 0,
            clipPath: "inset(100% 0 0 0)",
          });

        const stopBurst = () => {
          burstTimeline?.kill();
          burstTimeline = null;
          gsap.killTweensOf(photoElements);
          hidePhotosOffscreen();
        };

        const scatterPhotosForBurst = () => {
          photoElements.forEach((photo, index) => {
            gsap.set(photo, {
              left: randomBetween(2, 98) + "%",
              top: randomBetween(2, 98) + "%",
              x: randomBetween(-48, 48),
              y: randomBetween(50, 110),
              rotation: randomBetween(-12, 12) * 0.2,
              zIndex: index,
            });
          });
        };

        const playBurst = () => {
          stopBurst();
          scatterPhotosForBurst();

          const staggerSeconds = 0.09;
          const revealDuration = 0.34;
          const exitDuration = 0.3;
          const exitStaggerSeconds = 0.07;
          const photoCount = photoElements.length;
          const revealEndTime = (photoCount - 1) * staggerSeconds + revealDuration;

          burstTimeline = gsap.timeline({ onComplete: stopBurst });

          photoElements.forEach((photo, index) => {
            burstTimeline.to(
              photo,
              {
                x: randomBetween(-40, 40),
                y: randomBetween(-30, 30),
                rotation: randomBetween(-12, 12),
                clipPath: "inset(0% 0 0 0)",
                ease: "power3.out",
                duration: revealDuration,
              },
              index * staggerSeconds
            );
          });

          photoElements.forEach((photo, index) => {
            burstTimeline.to(
              photo,
              {
                y: "+=" + randomBetween(180, 280),
                x: "+=" + randomBetween(-55, 55),
                rotation: "+=" + randomBetween(-10, 10),
                clipPath: "inset(0% 0 100% 0)",
                ease: "power2.in",
                duration: exitDuration,
              },
              revealEndTime + index * exitStaggerSeconds
            );
          });
        };

        hidePhotosOffscreen();

        keywordTriggers.forEach((trigger) => {
          trigger.addEventListener("mouseenter", playBurst);
          trigger.addEventListener("focus", playBurst);
        });
        heroSection.addEventListener("mouseleave", stopBurst);
      })();
    </script>
  </body>
</html>
