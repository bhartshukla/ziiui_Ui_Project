<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Gallery</title>
</head>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap');

    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body{
        font-family: "Raleway", sans-serif;
        height: 100vh;
        width: 100vw;
        background: #f2f2f2;
    }

    main{
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .projects{
        display: flex;
        flex-direction: column;
        width: 1000px;
    }

    .project{
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 3rem 8rem;
        border-top: 1px solid #00000046;
        cursor: pointer;
    }

    .project h2{
        font-size: 3.5rem;
        font-weight: 500;
        transition: 0.5s ease;
    }

    .project p{
        transition: 0.5s ease;
    }

    .project:last-child{
        border-bottom: 1px solid #00000046;
    }

    .project:hover{
        opacity: 0.5;
    }

    .project:hover h2{
        transform: translateX(-15px);
    }

    .project:hover p{
        transform: translateX(15px);
    }


    .project-thumbnail{
        position: fixed;
        width: 400px;
        height: 250px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        pointer-events: none;
        top: 0;
        left: 0;
        transform-origin: center center;
    }

    .thumbnail{
        width: 100%;
        height: 100%;
    }

    .thumbnail img{
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

</style>

<body>
    <main>
        <div class="projects">
            <div class="project">
                <h2>Mann Sales</h2>
                <p>Design & Development</p>
            </div>
            <div class="project">
                <h2>Lab.</h2>
                <p>Project Type</p>
            </div>
            <div class="project">
                <h2>Fringe</h2>
                <p>Project Type</p>
            </div>
            <div class="project">
                <h2>Astro Club</h2>
                <p>Project Type</p>
            </div>
        </div>

        <div class="project-thumbnail">
            
            <div class="thumbnail">
                <img src="https://i.pinimg.com/1200x/6d/47/22/6d4722b27a1acccd09b1add01c905ff3.jpg" alt="">
            </div>
            <div class="thumbnail">
                <img src="https://i.pinimg.com/736x/8f/39/c4/8f39c40449d2f512763fff45719b20e3.jpg" alt="">
            </div>
            <div class="thumbnail">
                <img src="https://i.pinimg.com/736x/89/c5/b3/89c5b3925874afdd643fbe67a487813d.jpg" alt="">
            </div>
            <div class="thumbnail">
                <img src="https://i.pinimg.com/736x/9a/cd/c5/9acdc5e6672acb43c4648a0d2fce3a52.jpg" alt="">
            </div>
        </div>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        const projects = gsap.utils.toArray(".project");
        const thumbnails = gsap.utils.toArray(".thumbnail");
        const projectThumbnail = document.querySelector(".project-thumbnail");
        const projectsContainer = document.querySelector(".projects");

        gsap.set(projectThumbnail, { scale: 0, xPercent: -50, yPercent: -50 });

        const xTo = gsap.quickTo(projectThumbnail, "x", { duration: 0.4, ease: "power3.out" });
        const yTo = gsap.quickTo(projectThumbnail, "y", { duration: 0.4, ease: "power3.out" });


        projectsContainer.addEventListener("mousemove", (e) => {
            xTo(e.clientX);
            yTo(e.clientY);
        });


        projectsContainer.addEventListener("mouseleave", () => {
            gsap.to(projectThumbnail, {
                scale: 0,
                duration: 0.3,
                ease: "power2.out",
                overwrite: "auto"
            });
        });

        projects.forEach((project, index) => {
            project.addEventListener("mouseenter", () => {
                gsap.to(projectThumbnail, {
                    scale: 1,
                    duration: 0.4,
                    ease: "power2.out",
                    overwrite: "auto"
                });

                gsap.to(thumbnails, {
                    yPercent: -100 * index,
                    duration: 0.4,
                    ease: "power2.out",
                    overwrite: "auto"
                });
            });
        });

    </script>
</body>
</html>
