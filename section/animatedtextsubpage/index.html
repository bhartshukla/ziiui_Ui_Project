<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZiiUI Focus Scroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0c;
      --ink: #f4f0e8;
      --muted: #8a8680;
      --cream: #ede8df;
      --forest: #3b6947;
      --wine: #721e30;
      --gold: #c9a84c;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html.lenis, html.lenis body { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto !important; }
    .lenis.lenis-stopped { overflow: hidden; }

    body {
      font-family: "Bricolage Grotesque", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    section {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .label {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-weight: 800;
      line-height: 0.92;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }

    .top, .foot {
      height: 100svh;
      display: grid;
      place-content: center;
      text-align: center;
      padding: 2rem;
    }

    .top {
      background: var(--bg);
    }

    .top .label {
      color: var(--gold);
    }

    .top h1, .foot h1 {
      font-size: clamp(3rem, 13vw, 8rem);
      background: linear-gradient(180deg, var(--ink) 0%, var(--muted) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .foot {
      background: linear-gradient(180deg, #2a2a2f 0%, var(--bg) 100%);
    }

    .row {
      height: 85svh;
      display: flex;
      align-items: center;
    }

    .row:nth-child(1) {
      background: linear-gradient(135deg, var(--forest) 0%, #0f1a12 100%);
      color: var(--cream);
    }

    .row:nth-child(2) {
      background: var(--cream);
      color: var(--bg);
    }

    .row:nth-child(3) {
      background: linear-gradient(135deg, var(--wine) 0%, #1a0a0e 100%);
      color: var(--cream);
    }

    .row h1 {
      font-size: clamp(3rem, 11vw, 9rem);
    }

    .row:nth-child(2) h1 {
      color: var(--bg);
    }

    .track {
      width: 100%;
      display: flex;
      justify-content: center;
      will-change: transform;
    }

    .ch {
      display: inline-block;
      will-change: transform;
    }
  </style>
</head>
<body>

  <section class="top">
    <p class="label">Scroll to explore</p>
    <h1>Just Scroll</h1>
  </section>

  <section class="stack">
    <div class="row">
      <div class="track"><h1>Pull Into Focus</h1></div>
    </div>
    <div class="row">
      <div class="track"><h1>Fade Into Static</h1></div>
    </div>
    <div class="row">
      <div class="track"><h1>Burst Into Bloom</h1></div>
    </div>
  </section>

  <section class="foot">
    <h1>The End</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger, SplitText);

    const lenis = new Lenis({ duration: 1.1, smoothWheel: true });
    lenis.on("scroll", ScrollTrigger.update);
    gsap.ticker.add((time) => lenis.raf(time * 1000));
    gsap.ticker.lagSmoothing(0);

    const headings = gsap.utils.toArray(".row h1");
    const splits = [];

    headings.forEach((heading) => {
      const split = SplitText.create(heading, { type: "chars", charsClass: "ch" });
      splits.push(split);

      split.chars.forEach((char, index) => {
        const startY = index % 2 === 0 ? -150 : 150;
        gsap.set(char, { y: startY });
      });
    });

    gsap.utils.toArray(".row").forEach((row, rowIndex) => {
      const track = row.querySelector(".track");
      const slideFrom = rowIndex === 1 ? -100 : 100;
      const split = splits[rowIndex];
      const charCount = split.chars.length;

      ScrollTrigger.create({
        trigger: row,
        start: "top bottom",
        end: "top top",
        scrub: 1,
        onUpdate(self) {
          gsap.set(track, { x: `${slideFrom - self.progress * slideFrom}%` });

          split.chars.forEach((char, index) => {
            const staggerIndex = rowIndex === 1 ? charCount - 1 - index : index;
            const delay = 0.1 + (staggerIndex / charCount) * 0.675;
            const duration = 0.9 - (0.675 * (charCount - 1)) / charCount;

            let charProgress = 0;
            if (self.progress >= delay) {
              charProgress = Math.min(1, (self.progress - delay) / duration);
            }

            const startY = index % 2 === 0 ? -150 : 150;
            gsap.set(char, { y: startY * (1 - charProgress) });
          });
        },
      });
    });
  </script>
</body>
</html>
